# https://www.playframework.com/documentation/latest/Configuration
play.application.loader = AppLoader

# this will be overwritten in prod (using `simple-configuration` lib)
play.http.secret.key = changeme

# Allow access to the server - since we restrict connections to the vpc in aws, this should be safe
play.filters.hosts {
  allowed = ["."]
}

play.filters.csp {
  directives {
    default-src = ${play.filters.csp.nonce.pattern} "'strict-dynamic'"
    connect-src = "'self' 'https://*.gutools.co.uk/' 'https://*.dev-gutools.co.uk/'"
  }
}

play.assets.cache."/public/index.html" = "no-cache"

pekko.http.server.parsing.error-handler = "lib.UnknownMethodParsingErrorHandler$"
